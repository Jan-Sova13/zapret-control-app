name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*' # Запускать сборку при отправке любого тега, начинающегося на v

permissions:
  contents: write # Разрешение для бота создавать релизы и загружать файлы

jobs:
  build:
    runs-on: windows-latest # Используем виртуальную машину с Windows

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Сборка проекта в один EXE
        run: dotnet publish ./ZapretControlApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Упаковка
        shell: pwsh
        run: |
          # GitHub заменяет пробелы в именах файлов релиза на точки, поэтому exe кладём в zip:
          # имя архива без пробелов, а внутри остаётся "Zapret Control App.exe"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $zip = "release/Zapret-Control-App-${{ github.ref_name }}.zip"
          Compress-Archive -LiteralPath "publish/Zapret Control App.exe" -DestinationPath $zip -Force


      - name: Создание релиза и прикрепление файлов
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Zapret-Control-App-*.zip
